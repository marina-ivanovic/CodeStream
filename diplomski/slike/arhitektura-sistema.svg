<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="518" fill="#ffffff" stroke="none"/>

  <!-- Docker network boundary -->
  <rect x="40" y="200" width="820" height="230" rx="10" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="55" y="218" font-size="13" fill="#666666">интерна Docker мрежа</text>

  <!-- Browser -->
  <rect x="340" y="15" width="220" height="45" rx="8" fill="#eef3fb" stroke="#333333" stroke-width="2"/>
  <text x="450" y="42" font-size="16" text-anchor="middle" fill="#111111">Browser (localhost:5500)</text>

  <!-- nginx gateway -->
  <rect x="70" y="105" width="760" height="55" rx="8" fill="#fdf3d9" stroke="#333333" stroke-width="2"/>
  <text x="450" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">nginx — API Gateway</text>
  <text x="450" y="148" font-size="13" text-anchor="middle" fill="#444444">reverse proxy + сервирање SPA апликације</text>

  <!-- Services row -->
  <rect x="80" y="225" width="170" height="75" rx="8" fill="#e7f4ea" stroke="#333333" stroke-width="2"/>
  <text x="165" y="252" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Auth &amp; User</text>
  <text x="165" y="269" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Service</text>
  <text x="165" y="287" font-size="13" text-anchor="middle" fill="#444444">:3000</text>

  <rect x="270" y="225" width="170" height="75" rx="8" fill="#e7f4ea" stroke="#333333" stroke-width="2"/>
  <text x="355" y="252" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Session Gateway</text>
  <text x="355" y="269" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Service</text>
  <text x="355" y="287" font-size="13" text-anchor="middle" fill="#444444">:3001</text>

  <rect x="460" y="225" width="170" height="75" rx="8" fill="#e7f4ea" stroke="#333333" stroke-width="2"/>
  <text x="545" y="252" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">CRDT Sync</text>
  <text x="545" y="269" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Service</text>
  <text x="545" y="287" font-size="13" text-anchor="middle" fill="#444444">:3002</text>

  <rect x="650" y="225" width="170" height="75" rx="8" fill="#e7f4ea" stroke="#333333" stroke-width="2"/>
  <text x="735" y="252" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Code Execution</text>
  <text x="735" y="269" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Service</text>
  <text x="735" y="287" font-size="13" text-anchor="middle" fill="#444444">:3003</text>

  <!-- Bottom row: storage / infra -->
  <rect x="95" y="350" width="140" height="60" rx="8" fill="#f2e9f7" stroke="#333333" stroke-width="2"/>
  <text x="165" y="385" font-size="14" text-anchor="middle" fill="#111111">PostgreSQL</text>

  <rect x="285" y="350" width="140" height="60" rx="8" fill="#f2e9f7" stroke="#333333" stroke-width="2"/>
  <text x="355" y="385" font-size="14" text-anchor="middle" fill="#111111">RabbitMQ</text>

  <rect x="475" y="350" width="140" height="60" rx="8" fill="#f2e9f7" stroke="#333333" stroke-width="2"/>
  <text x="545" y="385" font-size="14" text-anchor="middle" fill="#111111">Redis</text>

  <rect x="665" y="350" width="140" height="60" rx="8" fill="#f2e9f7" stroke="#333333" stroke-width="2"/>
  <text x="735" y="378" font-size="14" text-anchor="middle" fill="#111111">Docker</text>
  <text x="735" y="395" font-size="13" text-anchor="middle" fill="#444444">sandbox</text>

  <!-- Arrows: browser -> nginx -->
  <line x1="450" y1="60" x2="450" y2="103" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: nginx -> services -->
  <line x1="165" y1="160" x2="165" y2="223" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="160" x2="355" y2="223" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="160" x2="545" y2="223" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="735" y1="160" x2="735" y2="223" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auth <-> Session Gateway: synchronous HTTP -->
  <line x1="250" y1="262" x2="268" y2="262" stroke="#333333" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="259" y="250" font-size="11" text-anchor="middle" fill="#444444">HTTP</text>

  <!-- Services -> storage -->
  <line x1="165" y1="300" x2="165" y2="348" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="300" x2="355" y2="348" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="300" x2="545" y2="348" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="735" y1="300" x2="735" y2="348" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CRDT Sync -> RabbitMQ (diagonal) -->
  <line x1="500" y1="300" x2="410" y2="348" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="452" y="330" font-size="11" text-anchor="middle" fill="#444444">crdt.operations / crdt.results</text>
</svg>
