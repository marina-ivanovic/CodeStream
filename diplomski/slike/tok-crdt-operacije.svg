<svg viewBox="0 0 920 590" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="918" height="588" fill="#ffffff" stroke="none"/>

  <!-- Lifeline headers -->
  <!-- centers: BrowserA=60, Gateway=220, RabbitMQ=380, CRDTSync=540, Redis=700, BrowserB=860 -->
  <g>
    <rect x="0" y="15" width="120" height="45" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/>
    <text x="60" y="42" font-size="13" text-anchor="middle">Browser A</text>
  </g>
  <g>
    <rect x="160" y="15" width="120" height="45" rx="6" fill="#e7f4ea" stroke="#333333" stroke-width="1.5"/>
    <text x="220" y="35" font-size="12" text-anchor="middle">Session</text>
    <text x="220" y="50" font-size="12" text-anchor="middle">Gateway</text>
  </g>
  <g>
    <rect x="320" y="15" width="120" height="45" rx="6" fill="#f2e9f7" stroke="#333333" stroke-width="1.5"/>
    <text x="380" y="42" font-size="13" text-anchor="middle">RabbitMQ</text>
  </g>
  <g>
    <rect x="480" y="15" width="120" height="45" rx="6" fill="#e7f4ea" stroke="#333333" stroke-width="1.5"/>
    <text x="540" y="35" font-size="12" text-anchor="middle">CRDT Sync</text>
    <text x="540" y="50" font-size="12" text-anchor="middle">Service</text>
  </g>
  <g>
    <rect x="640" y="15" width="120" height="45" rx="6" fill="#f2e9f7" stroke="#333333" stroke-width="1.5"/>
    <text x="700" y="42" font-size="13" text-anchor="middle">Redis</text>
  </g>
  <g>
    <rect x="800" y="15" width="120" height="45" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/>
    <text x="860" y="42" font-size="13" text-anchor="middle">Browser B</text>
  </g>

  <!-- lifelines -->
  <line x1="60"  y1="60" x2="60"  y2="560" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="220" y1="60" x2="220" y2="560" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="380" y1="60" x2="380" y2="560" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="540" y1="60" x2="540" y2="560" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="700" y1="60" x2="700" y2="560" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="860" y1="60" x2="860" y2="560" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- step circles -->
  <g font-size="12" text-anchor="middle">
    <circle cx="22" cy="105" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="109">1</text>
    <circle cx="22" cy="165" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="169">2</text>
    <circle cx="22" cy="225" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="229">3</text>
    <circle cx="22" cy="285" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="289">4</text>
    <circle cx="22" cy="345" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="349">5</text>
    <circle cx="22" cy="405" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="409">6</text>
    <circle cx="22" cy="465" r="11" fill="#ffffff" stroke="#333333"/><text x="22" y="469">7</text>
  </g>

  <!-- 1: Browser A -> Gateway -->
  <text x="140" y="98" font-size="12" text-anchor="middle">WS: insert / delete</text>
  <line x1="60" y1="105" x2="218" y2="105" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- 2: Gateway -> RabbitMQ -->
  <text x="300" y="158" font-size="12" text-anchor="middle">publish crdt.operations</text>
  <line x1="220" y1="165" x2="378" y2="165" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- 3: RabbitMQ -> CRDT Sync -->
  <text x="460" y="218" font-size="12" text-anchor="middle">consume crdt.operations</text>
  <line x1="380" y1="225" x2="538" y2="225" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- 4: CRDT Sync -> Redis -->
  <text x="620" y="278" font-size="12" text-anchor="middle">SET doc:{project_id}</text>
  <line x1="540" y1="285" x2="698" y2="285" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- 5: CRDT Sync -> RabbitMQ (back) -->
  <text x="460" y="338" font-size="12" text-anchor="middle">publish crdt.results</text>
  <line x1="540" y1="345" x2="382" y2="345" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- 6: RabbitMQ -> Gateway (back) -->
  <text x="300" y="398" font-size="12" text-anchor="middle">consume crdt.results</text>
  <line x1="380" y1="405" x2="222" y2="405" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- 7: Gateway -> Browser A and Browser B (broadcast) -->
  <text x="460" y="458" font-size="12" text-anchor="middle">broadcast: resolved_operation, document_text</text>
  <line x1="220" y1="465" x2="62" y2="465" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="220" y1="490" x2="858" y2="490" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <text x="450" y="545" font-size="12" text-anchor="middle" fill="#666666">Порука се шаље свим активним конекцијама у "соби" пројекта, укључујући корисника који је извршио измену.</text>
</svg>
